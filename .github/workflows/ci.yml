name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  ruff-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
      - run: uv sync --extra dev
        env:
          VIRTUAL_ENV: ""
      - run: uv run ruff check .
        env:
          VIRTUAL_ENV: ""

  mypy-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
      - run: uv sync --extra dev
        env:
          VIRTUAL_ENV: ""
      - run: uv run mypy .
        env:
          VIRTUAL_ENV: ""

  pytest-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acme
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
      - run: uv sync --extra dev
        env:
          VIRTUAL_ENV: ""
      - run: uv run pytest --cov --cov-report=term-missing --no-header
        env:
          VIRTUAL_ENV: ""
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/acme
          DJANGO_SETTINGS_MODULE: config.settings.development
          OPENAI_API_KEY: test-invalid-fake-key  # Test-only dummy key — not a real credential
          ANTHROPIC_API_KEY: test-invalid-ant-fake-key  # Test-only dummy key — not a real credential

  vitest-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
