[project]
name = "acme-backend"
version = "0.1.0"
description = "ACME Content Workflow - Django + Strawberry GraphQL backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "strawberry-graphql[django]>=0.250,<1",
    "uvicorn[standard]>=0.32,<1",
    "gunicorn>=23,<24",
    "django-environ>=0.12,<1",
    "channels>=4.2,<5",
    "daphne>=4.1,<5",
    "openai>=1.55,<2",
    "anthropic>=0.49,<1",
    "psycopg2-binary>=2.9,<3",
    "django-cors-headers>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-django>=4.9,<5",
    "pytest-cov>=6,<7",
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
    "django-stubs>=6.0.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
testpaths = ["apps", "tests"]
python_files = ["test_*.py", "*_tests.py"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["migrations", ".venv"]
disable_error_code = ["var-annotated", "type-arg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

