[project]
name = "acme-backend"
version = "0.1.0"
description = "ACME Content Workflow - Django + Strawberry GraphQL backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "strawberry-graphql[django]>=0.250,<1",
    "uvicorn[standard]>=0.32,<1",
    "gunicorn>=23,<24",
    "django-environ>=0.12,<1",
    "channels>=4.2,<5",
    "daphne>=4.1,<5",
    "openai>=1.55,<2",
    "anthropic>=0.49,<1",
    "psycopg2-binary>=2.9,<3",
    "django-cors-headers>=4.9.0",
    "PyJWT>=2.10,<3",
    "channels-redis>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-django>=4.9,<5",
    "pytest-cov>=6,<7",
    "pytest-asyncio>=0.24,<1",
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
    "django-stubs>=6.0.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
testpaths = ["apps", "tests"]
python_files = ["test_*.py", "*_tests.py"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["migrations", ".venv"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "channels-stubs>=0.1.4",
    "django-stubs>=6.0.5",
    "mypy>=1.20.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.3.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.18",
]

